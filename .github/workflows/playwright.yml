name: Playwright Tests
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [labeled]
jobs:
  test:
    if: github.event.label.name == 'playwright'
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g yarn && yarn
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Set env for E2E test (DEV)
      run: cp tests/e2e-tests/dev.env tests/e2e-tests/.env && sed -i "s/^SEARCH_TRANSACTIONS_TOKEN.*$/SEARCH_TRANSACTIONS_TOKEN=${{secrets.SEARCH_TRANSACTIONS_TOKEN_DEV}}/" tests/e2e-tests/.env
    - name: Run Playwright tests dev
      run: yarn e2e-tests
    - name: Set env for E2E test (UAT)
      run: cp tests/e2e-tests/uat.env tests/e2e-tests/.env && sed -i "s/^SEARCH_TRANSACTIONS_TOKEN.*$/SEARCH_TRANSACTIONS_TOKEN=${{secrets.SEARCH_TRANSACTIONS_TOKEN_UAT}}/" tests/e2e-tests/.env
    - name: Run Playwright tests uat
      run: yarn e2e-tests
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
